name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check anvesh tests --select E,F,W --ignore E501,E741
      - run: pytest -q
      - run: python eval/run_eval.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Security tests
        working-directory: backend
        run: pytest -q tests/test_security.py
      - name: Static analysis (bandit, medium+ severity fails)
        run: bandit -q -r backend/anvesh -ll
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend dependency audit (production, high+ fails)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
